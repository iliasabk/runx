skill: crm-cleanup
version: "0.2.0"

catalog:
  kind: graph
  audience: operator
  visibility: public
  role: canonical
  execution: execute
  completion: runtime_receipt
  requires_adapter: false
  approval: none

harness:
  cases:
    - name: crm-cleanup-executes-allowlisted-updates
      operator_journeys:
        - mode: standalone
          confusors: [lead-enrichment, lead-router]
          request: Reconcile this call transcript against the CRM store and write the supported field updates.
          expected_outcome: Commit allowlisted field updates through the CRM event-store transport and seal a write_result with before and after state.
        - mode: composed
          request: Continue from this sealed write_result into downstream reporting.
          expected_outcome: Reuse the committed write_result and field_updates without re-reconciling the transcript.
          prior_evidence:
            - The sealed crm_cleanup_result with takeaways, field_updates, and write_result supplied by the prior step.
          must_not_repeat:
            - Do not re-derive or re-commit updates already sealed in write_result.
      inputs:
        transcript: "Call with Globex on renewal. Dana said the rollout stalled and they want an executive review before renewing. Next step agreed: send the Q3 usage report by Friday."
        crm_source:
          data_source_ref: local://runx-data-store/crm-harness-execute
          resource: crm_records
          aggregate_id: pipeline-q3
        crm_bootstrap:
          records:
            - id: acct-globex
              account_status: healthy
              next_action: none
        crm_schema:
          allowed_fields: [account_status, next_action, health_score]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            reconcile_draft:
              takeaways:
                - Rollout stalled; Globex wants an executive review before renewing.
                - Next step: send the Q3 usage report by Friday.
              updates:
                - record_id: acct-globex
                  field: account_status
                  to: at_risk
                  evidence_quote: the rollout stalled and they want an executive review before renewing
                - record_id: acct-globex
                  field: next_action
                  to: send the Q3 usage report by Friday
                  evidence_quote: "send the Q3 usage report by Friday"
      expect:
        status: sealed
        steps: [bootstrap-gate, bootstrap, read-head, read-events, project-records, digest-transcript, digest-records, reconcile, decide, write, read-back, seal]
        step_outputs:
          write:
            subset:
              data_operation_result:
                data:
                  operation: append_event
                  status: committed
                  provider: sqlite-event-store
          seal:
            subset:
              crm_cleanup_result:
                data:
                  schema: runx.crm_cleanup_result.v1
                  decision: executed
                  write_result:
                    executed: true
                    committed_event:
                      event_type: crm.field_updates
                      event_ref: "crm_records:pipeline-q3:2"
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-noop-writes-nothing
      operator_journeys:
        - mode: standalone
          confusors: [lead-enrichment, lead-router]
          request: Reconcile this routine check-in transcript against the CRM store.
          expected_outcome: Seal no_action with no committed write when the transcript supports no field change.
      inputs:
        transcript: "Routine check-in with Globex. Dana confirmed everything is on track; no changes discussed."
        crm_source:
          data_source_ref: local://runx-data-store/crm-harness-noop
          resource: crm_records
          aggregate_id: pipeline-q3
        crm_bootstrap:
          records:
            - id: acct-globex
              account_status: healthy
        crm_schema:
          allowed_fields: [account_status, next_action]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            reconcile_draft:
              takeaways:
                - Routine check-in; account remains on track.
              updates: []
      expect:
        status: sealed
        steps: [bootstrap-gate, bootstrap, read-head, read-events, project-records, digest-transcript, digest-records, reconcile, decide, read-back, seal]
        step_outputs:
          seal:
            subset:
              crm_cleanup_result:
                data:
                  decision: no_action
                  field_updates: []
                  write_result:
                    executed: false
                    committed_event: null
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-rejects-unlisted-field
      inputs:
        transcript: "Owner said move the account to Kim."
        crm_source:
          data_source_ref: local://runx-data-store/crm-harness-reject
          resource: crm_records
          aggregate_id: pipeline-q3
        crm_bootstrap:
          records:
            - id: acct-1
              owner: lee
        crm_schema:
          allowed_fields: [next_action]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            reconcile_draft:
              takeaways:
                - Account ownership change was mentioned.
              updates:
                - record_id: acct-1
                  field: owner
                  to: kim
                  evidence_quote: move the account to Kim
      expect:
        status: sealed
        steps: [bootstrap-gate, bootstrap, read-head, read-events, project-records, digest-transcript, digest-records, reconcile, decide, read-back, seal]
        step_outputs:
          seal:
            subset:
              crm_cleanup_result:
                data:
                  decision: no_action
                  field_updates: []
                  rejected_updates:
                    - record_id: acct-1
                      field: owner
                      reason: field is outside the crm_schema allowlist
                  write_result: { executed: false, committed_event: null }
                  validation: { status: pass, findings: [] }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-refuses-invented-quote
      inputs:
        transcript: "Short call, no changes discussed."
        crm_source:
          data_source_ref: local://runx-data-store/crm-harness-refuse
          resource: crm_records
          aggregate_id: pipeline-q3
        crm_bootstrap:
          records:
            - id: acct-1
              account_status: healthy
        crm_schema:
          allowed_fields: [account_status]
      caller:
        answers:
          agent_task.crm-cleanup-reconcile.output:
            reconcile_draft:
              takeaways: []
              updates:
                - record_id: acct-1
                  field: account_status
                  to: at_risk
                  evidence_quote: customer threatened to churn immediately
      expect:
        status: sealed
        steps: [bootstrap-gate, bootstrap, read-head, read-events, project-records, digest-transcript, digest-records, reconcile, decide, read-back, seal]
        step_outputs:
          seal:
            subset:
              crm_cleanup_result:
                data:
                  decision: refused
                  field_updates: []
                  write_result: { executed: false, committed_event: null }
                  validation: { status: fail }
        receipt: { schema: runx.receipt.v1 }

    - name: crm-cleanup-needs-transcript
      inputs:
        crm_source:
          data_source_ref: local://runx-data-store/crm-harness-notranscript
          resource: crm_records
          aggregate_id: pipeline-q3
        crm_schema:
          allowed_fields: [next_action]
      expect:
        status: failure

runners:
  reconcile:
    default: true
    type: graph
    inputs:
      transcript:
        type: string
        required: true
        description: Call transcript that is the only evidence for field updates.
      crm_source:
        type: object
        required: true
        description: Handle of the CRM record store the skill reads at run time and writes through.
        schema:
          additionalProperties: false
          required: [data_source_ref, resource, aggregate_id]
          properties:
            data_source_ref: { type: string, minLength: 1, maxLength: 1000 }
            resource: { type: string, minLength: 1, maxLength: 500 }
            aggregate_id: { type: string, minLength: 1, maxLength: 500 }
      crm_bootstrap:
        type: object
        required: false
        description: Optional connector export imported into the CRM store as a crm.records_snapshot before reconciling; omit when the store already holds the records.
        schema:
          additionalProperties: false
          required: [records]
          properties:
            records:
              type: array
              maxItems: 500
              items:
                type: object
                additionalProperties: true
      crm_schema:
        type: object
        required: true
        description: Explicit update authority; fields outside allowed_fields are rejected.
        schema:
          additionalProperties: false
          properties:
            allowed_fields:
              type: array
              minItems: 1
              maxItems: 100
              items: { type: string, minLength: 1, maxLength: 200 }
    examples:
      - transcript: "Dana said the rollout stalled."
        crm_source:
          data_source_ref: local://runx-data-store/crm-example
          resource: crm_records
          aggregate_id: pipeline-q3
        crm_bootstrap:
          records:
            - id: acct-globex
              account_status: healthy
        crm_schema:
          allowed_fields: [account_status]
    graph:
      name: crm-cleanup-reconcile
      result_from: [seal]
      steps:
        - id: bootstrap-gate
          label: detect a connector export to import before reading
          inputs:
            crm_bootstrap: $input.crm_bootstrap
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: bootstrapGate
            outputs:
              bootstrap_gate: object

        - id: bootstrap
          label: import the connector export snapshot into the CRM store
          tool: data.append_event
          scopes:
            - runx:data:append
          when:
            field: bootstrap-gate.bootstrap_gate.decision
            equals: import
          inputs:
            data_source_ref: $input.crm_source.data_source_ref
            resource: $input.crm_source.resource
            aggregate_id: $input.crm_source.aggregate_id
            expected_version: 0
          context:
            event: bootstrap-gate.bootstrap_gate.snapshot_event
            idempotency_key: bootstrap-gate.bootstrap_gate.idempotency_key

        - id: read-head
          label: read the CRM stream head before deciding
          tool: data.read_projection
          scopes:
            - runx:data:read
          inputs:
            data_source_ref: $input.crm_source.data_source_ref
            resource: $input.crm_source.resource
            aggregate_id: $input.crm_source.aggregate_id

        - id: read-events
          label: read the current CRM records from the store at run time
          tool: data.read_events
          scopes:
            - runx:data:read
          inputs:
            data_source_ref: $input.crm_source.data_source_ref
            resource: $input.crm_source.resource
            aggregate_id: $input.crm_source.aggregate_id

        - id: project-records
          label: fold the event stream into the current record set
          context:
            read_result: read-events.data_operation_result.data
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: projectRecords
            outputs:
              records_packet: object
          artifacts:
            named_emits:
              records_packet: records_packet

        - id: digest-transcript
          tool: data.digest
          inputs:
            value: $input.transcript
            encoding: utf8_text

        - id: digest-records
          tool: data.digest
          context:
            value: project-records.records_packet.data.records

        - id: reconcile
          label: derive candidate field updates and takeaways from the transcript
          inputs:
            transcript: $input.transcript
            crm_schema: $input.crm_schema
          context:
            crm_records: project-records.records_packet.data.records
          run:
            type: agent-task
            agent: reviewer
            task: crm-cleanup-reconcile
            outputs:
              reconcile_draft: object
          allowed_tools: []
          artifacts:
            named_emits:
              reconcile_draft: reconcile_draft

        - id: decide
          label: enforce allowlist and transcript traceability deterministically
          inputs:
            transcript: $input.transcript
            crm_source: $input.crm_source
            crm_schema: $input.crm_schema
          context:
            crm_records: project-records.records_packet.data.records
            reconcile_draft: reconcile.reconcile_draft.data
            transcript_digest: digest-transcript.digest_result.data.digest
            records_digest: digest-records.digest_result.data.digest
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: decideUpdates
            outputs:
              decision_packet: object
          artifacts:
            named_emits:
              decision_packet: decision_packet

        - id: write
          label: commit the decided field updates through the CRM transport
          tool: data.append_event
          scopes:
            - runx:data:append
          when:
            field: decide.decision_packet.data.decision
            equals: executed
          inputs:
            data_source_ref: $input.crm_source.data_source_ref
            resource: $input.crm_source.resource
            aggregate_id: $input.crm_source.aggregate_id
          context:
            event: decide.decision_packet.data.write_event
            idempotency_key: decide.decision_packet.data.idempotency_key
            expected_version: read-head.data_operation_result.data.after_version

        - id: read-back
          label: re-read the CRM stream to prove the committed write
          tool: data.read_events
          scopes:
            - runx:data:read
          inputs:
            data_source_ref: $input.crm_source.data_source_ref
            resource: $input.crm_source.resource
            aggregate_id: $input.crm_source.aggregate_id

        - id: seal
          label: seal takeaways, field_updates, and the executed write_result
          inputs:
            crm_source: $input.crm_source
          context:
            before_events: read-events.data_operation_result.data
            after_events: read-back.data_operation_result.data
            decision: decide.decision_packet.data
          run:
            type: javascript
            module: crm-cleanup.mjs
            export: sealResult
            outputs:
              takeaways: array
              field_updates: array
              write_result: object
              crm_cleanup_result:
                type: object
                schema:
                  required: [schema, decision, reason, takeaways, field_updates, write_result, rejected_updates, transcript_digest, records_digest, validation]
                  properties:
                    schema: { const: runx.crm_cleanup_result.v1 }
                    decision: { type: string, enum: [executed, no_action, refused] }
                    reason: { type: string, minLength: 1, maxLength: 2000 }
                    takeaways:
                      type: array
                      maxItems: 100
                      items: { type: string, minLength: 1, maxLength: 2000 }
                    field_updates:
                      type: array
                      maxItems: 200
                      items:
                        type: object
                        required: [record_id, field, from, to, evidence_quote]
                        properties:
                          record_id: { type: string, minLength: 1, maxLength: 500 }
                          field: { type: string, minLength: 1, maxLength: 200 }
                          from: {}
                          to: {}
                          evidence_quote: { type: string, minLength: 1, maxLength: 4000 }
                    write_result:
                      type: object
                      required: [transport, executed, before, after]
                    rejected_updates:
                      type: array
                      maxItems: 200
                      items:
                        type: object
                        required: [record_id, field, reason]
                        properties:
                          record_id: { type: [string, "null"], maxLength: 500 }
                          field: { type: string, maxLength: 200 }
                          reason: { type: string, minLength: 1, maxLength: 500 }
                    transcript_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    records_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
                    validation:
                      type: object
                      required: [status, findings]
                      properties:
                        status: { type: string, enum: [pass, fail] }
                        findings:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            required: [code, message]
                            properties:
                              code: { type: string, minLength: 1, maxLength: 200 }
                              message: { type: string, minLength: 1, maxLength: 2000 }
          artifacts:
            named_emits:
              crm_cleanup_result: crm_cleanup_result
